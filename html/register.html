<!DOCTYPE html>
<html lang="es" class="main-form">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discoverly</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/png" href="../imgs/icons/icon.png">
</head>

<body>



<main >




    <form class="form-register">

    <h1>Crear cuenta</h1>

    <p>Únete a la comunidad Discoverly.</p>

    <label for="name">Nombre</label>
    <input type="text" id="name" placeholder="Tu nombre">

    <label for="email">Correo electrónico</label>
    <input type="email" id="email" placeholder="ejemplo@email.com">

    <label for="password">Contraseña</label>
    <input type="password" id="password" placeholder="••••••••">

    <label for="confirm-password">Confirmar contraseña</label>
    <input type="password" id="confirm-password" placeholder="••••••••">

    <button id="register-btn">Crear cuenta</button>

    <p id="register-message"></p>

    <div class="auth-link">
        ¿Ya tienes cuenta?
        <a href="login.html">Inicia sesión</a>
    </div>

</form>



</main>



<script type="module" src="../js/register.js"></script>
<script type="module" src="../js/auth.js"></script>

</body>
</html>
